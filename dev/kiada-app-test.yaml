apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiada
spec:
  selector: 
    matchLabels:
      app: kiada
  replicas: 2
  template: 
    metadata: 
      labels: 
        app: kiada
    spec:
      containers:
      - name: kiada
        image: timothy010/kiada:0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
